# DingTalk H5 standalone Docker Compose configuration.
# Use this when the backend is deployed separately.
#
# Example:
#   cp .env.docker.example .env
#   docker compose -f docker-compose.h5.yml up -d --build

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: ${DINGTALK_H5_LOG_MAX_SIZE:-20m}
    max-file: ${DINGTALK_H5_LOG_MAX_FILE:-5}

services:
  dingtalk-h5:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DINGTALK_CORP_ID: ${VITE_DINGTALK_CORP_ID:-}
    image: ${DINGTALK_H5_IMAGE:-wecheckin-dingtalk-h5:latest}
    container_name: ${DINGTALK_H5_CONTAINER_NAME:-wecheckin-dingtalk-h5}
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-32m}
      NGINX_API_PROXY_TARGET: ${NGINX_API_PROXY_TARGET:-http://host.docker.internal:8083}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DINGTALK_H5_HTTP_PORT:-8086}:80"
    networks:
      - dingtalk-h5-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  dingtalk-h5-network:
    driver: bridge
