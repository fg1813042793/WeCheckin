# DingTalk H5 standalone Docker Compose configuration.
# Use this when the backend is deployed separately.
#
# Example:
#   cp .env.docker.example .env
#   docker compose -f docker-compose.h5.yml up -d --build

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: 20m
    max-file: 5

services:
  wecheckin-dingding-h5:
    image: registry.cn-hangzhou.aliyuncs.com/ms_other_app/wecheckin-dingding-h5:1.0.0
    container_name: wecheckin-dingtalk-h5
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 8086:80
    networks:
      - dingtalk-h5-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  dingtalk-h5-network:
    driver: bridge
