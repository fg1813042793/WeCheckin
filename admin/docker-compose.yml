# Admin standalone Docker Compose configuration.
# Use this when the backend is deployed separately.
#
# Default routes:
#   /api/     -> backend API proxy
#   /upload/  -> backend upload API proxy
#   /uploads/ -> backend uploads static files
#   /         -> admin SPA
#   host port 3001 -> public survey pages (/sf1/:id plus their public APIs)
# Override with WECHECKIN_PUBLIC_SURVEY_HTTP_PORT.
#
# Example:
#   docker compose -f docker-compose.admin.yml up -d --build

services:
  wecheckin-admin:
    image: registry.cn-hangzhou.aliyuncs.com/ms_other_app/wecheckin-admin:1.0.0
    container_name: wecheckin-admin
    restart: unless-stopped
    ports:
      - 3000:80
      - "${WECHECKIN_PUBLIC_SURVEY_HTTP_PORT:-3001}:${NGINX_PUBLIC_SURVEY_PORT:-8081}"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-32m}
      NGINX_API_UPSTREAM: ${NGINX_API_UPSTREAM:-http://host.docker.internal:8083}
      NGINX_PUBLIC_SURVEY_PORT: ${NGINX_PUBLIC_SURVEY_PORT:-8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../backend/uploads:/usr/share/nginx/html/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
