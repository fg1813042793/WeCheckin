server:
  port: 8083
  mode: "debug"
  timeout: 30

cors:
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
    - "Accept"
    - "Content-Type"
    - "Accept"
    - "Authorization"

database:
  host: "101.37.205.158"
  port: 3307
  user: "root"
  password: "Pass_123"
  dbname: "go_wecheckin"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"

log:
  dir: "./logs"
  level: "info"
  max_age: 30
  compress: true

redis:
  host: "101.37.205.158"
  port: 6377
  password: "foster@2026"
  db: 10

scheduled_task:
  redis_key_prefix: "wecheckin"
  worker_count: 4
  scheduler_poll_seconds: 2
  scheduler_recovery_seconds: 30
  worker_poll_block_seconds: 5
  worker_heartbeat_seconds: 10
  worker_ttl_seconds: 30
  recovery_timeout_seconds: 90
  minimum_second_interval: 5
  run_retention_days: 90
  log_retention_days: 30
  max_log_segment_bytes: 16384
  max_log_run_bytes: 1048576
  enable_shell: false
  enable_sql: false
  http:
    allowed_hosts: []
    allowed_cidrs: []
    allow_private_networks: false
    max_redirects: 0
    max_request_bytes: 1048576
    max_response_bytes: 1048576
  shell_commands: {}
  sql_data_sources: {}

token:
  user:
    expire: "168h"
    redis_prefix: "user_token:"
  admin:
    expire: "24h"
    redis_prefix: "admin_token:"

oss:
  type: "local"  # aliyun, tencent, local
  aliyun:
    access_key_id: "your-aliyun-access-key"
    access_key_secret: "your-aliyun-secret"
    endpoint: "oss-cn-hangzhou.aliyuncs.com"
    bucket: "your-bucket"
  tencent:
    secret_id: "your-tencent-secret-id"
    secret_key: "your-tencent-secret-key"
    region: "ap-beijing"
    bucket: "your-bucket"
  local:
    path: "./uploads"
