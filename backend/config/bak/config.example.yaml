server:
  port: "8083"
  host: "0.0.0.0"
  mode: "debug"
  timeout: 30

cors:
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"

database:
  host: "localhost"
  port: 3306
  user: "wecheckin"
  password: "change-me"
  dbname: "wecheckin"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"

log:
  dir: "./logs"
  level: "info"
  max_age: 30
  compress: true

redis:
  host: "localhost"
  port: 6379
  password: "change-me"
  db: 0

token:
  user:
    expire: "168h"
    redis_prefix: "user_token:"
  admin:
    expire: "24h"
    redis_prefix: "admin_token:"

oss:
  type: "local"
  local:
    path: "./uploads"

security:
  app_id: "change-me"
  app_secret: "change-me"
