server:
  host: "0.0.0.0"
  port: 8083
  mode: "debug"
  timeout: 30
  read_timeout_seconds: 30
  write_timeout_seconds: 60
  idle_timeout_seconds: 120

cors:
  allow_credentials: false
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
    - "Accept"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "x-client-platform"

database:
  host: "localhost"
  port: 3306
  user: "root"
  password: ""
  dbname: "wecheckin"
  connect_timeout_seconds: 10
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime_minutes: 60
  conn_max_idle_time_minutes: 10
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"

log:
  dir: "./logs"
  level: "debug"
  max_age: 30
  compress: true

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

scheduled_task:
  redis_key_prefix: "wecheckin"
  worker_count: 4
  scheduler_poll_seconds: 30
  scheduler_recovery_seconds: 30
  worker_poll_block_seconds: 5
  worker_heartbeat_seconds: 10
  worker_ttl_seconds: 30
  recovery_timeout_seconds: 90
  minimum_second_interval: 5
  run_retention_days: 90
  log_retention_days: 30
  max_log_segment_bytes: 16384
  max_log_run_bytes: 1048576
  enable_shell: false
  enable_sql: false
  http:
    allowed_hosts: []
    allowed_cidrs: []
    allow_private_networks: false
    max_redirects: 0
    max_request_bytes: 1048576
    max_response_bytes: 1048576
  shell_commands: {}
  sql_data_sources: {}

token:
  user:
    expire: "168h"
    redis_prefix: "user_token:"
  admin:
    expire: "24h"
    redis_prefix: "admin_token:"

oss:
  type: "local"  # aliyun, tencent, local
  aliyun:
    access_key_id: ""
    access_key_secret: ""
    endpoint: "oss-cn-hangzhou.aliyuncs.com"
    bucket: "your-bucket"
  tencent:
    secret_id: ""
    secret_key: ""
    region: "ap-beijing"
    bucket: "your-bucket"
  local:
    path: "./uploads"
