# Copy this file to config.local.yaml for local-only overrides.
# config.local.yaml is ignored by Git. Never commit real credentials.

database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "CHANGE_ME"
  dbname: "wecheckin"
  connect_timeout_seconds: 10
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime_minutes: 60
  conn_max_idle_time_minutes: 10

redis:
  host: "localhost"
  port: 6379
  password: "CHANGE_ME"
  db: 0

oss:
  type: "local"
  aliyun:
    access_key_id: "CHANGE_ME"
    access_key_secret: "CHANGE_ME"
    endpoint: ""
    bucket: ""
  tencent:
    secret_id: "CHANGE_ME"
    secret_key: "CHANGE_ME"
    region: ""
    bucket: ""
  local:
    path: "./uploads"
