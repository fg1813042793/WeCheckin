    type: object
  swagger.AdminWorkflowInstanceDeleteRequest:
    properties:
      ids:
        description: IDs 是待删除的终态流程实例 ID，单次最多 100 个。
        example:
        - instance-1
        - instance-2
        items:
          type: string
        type: array
    type: object
  swagger.AdminWorkflowStartInstanceRequest:
    properties:
      businessKey:
        description: BusinessKey 是关联业务唯一键。
        example: review-202609
        type: string
      businessType:
        description: BusinessType 是关联业务类型。
        example: performance_review
        type: string
      definitionId:
        description: DefinitionID 是流程定义 ID。
        example: 1
        type: integer
      definitionVersion:
        description: DefinitionVersion 是发起时使用的流程发布版本。
        example: 1
        type: integer
      formData:
        additionalProperties: true
        description: FormData 是流程发起表单数据。
        type: object
      starterId:
        description: StarterID 是业务发起人用户 ID。
        example: "1001"
        type: string
      variables:
        additionalProperties: true
        description: Variables 是流程运行变量。
        type: object
    type: object
  swagger.DingTalkNotificationSendRequest:
    properties:
      content:
        description: Content 是钉钉通知正文。
        example: 系统将于今晚 22:00 进行维护。
        type: string
      departmentIds:
        description: DepartmentIDs 是指定部门范围下的部门 ID，执行时包含下级部门。
        example:
        - 3
        - 5
        items:
          type: integer
        type: array
      scope:
        description: Scope 是收件范围。
        enum:
        - all
        - departments
        - users
        example: departments
        type: string
      title:
        description: Title 是钉钉通知标题。
        example: 系统维护通知
        type: string
      userIds:
        description: UserIDs 是指定用户范围下的用户 ID。
        example:
        - 66
        - 67
        items:
          type: integer
        type: array
    type: object
  swagger.H5AppBindSelfRequest:
    properties:
      account:
        type: string
      bindTicket:
        type: string
      password:
        type: string
    type: object
  swagger.H5AppChangePasswordRequest:
    properties:
      confirmPassword:
        type: string
      currentPassword:
        type: string
      newPassword:
        type: string
    type: object
  swagger.H5AppLoginRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  swagger.H5AppSSOLoginRequest:
    properties:
      authCode:
        type: string
      corpId:
        type: string
    type: object
  swagger.H5AppWorkflowCommentRequest:
    properties:
      comment:
        type: string
      images:
        items:
          $ref: '#/definitions/swagger.H5AppWorkflowImage'
        type: array
    type: object
  swagger.H5AppWorkflowCompleteTaskRequest:
    properties:
      action:
        enum:
        - approve
        - reject
        - return
        - submit
        type: string
      comment:
        type: string
      formData:
        additionalProperties: true
        type: object
      images:
        items:
          $ref: '#/definitions/swagger.H5AppWorkflowImage'
        type: array
      returnTargetNodeId:
        type: string
      variables:
        additionalProperties: true
        type: object
    type: object
  swagger.H5AppWorkflowImage:
    properties:
      id:
        example: uploads/workflow/2026/09/04/comment.png
        type: string
      mimeType:
        example: image/png
        type: string
      name:
        example: comment.png
        type: string
      size:
        example: 2048
        type: integer
      url:
        example: /uploads/workflow/2026/09/04/comment.png
        type: string
    type: object
  swagger.H5AppWorkflowRemindRequest:
    properties:
      nodeId:
        type: string
    type: object
  swagger.H5AppWorkflowSaveDraftRequest:
    properties:
      definitionVersion:
        type: integer
      formData:
        additionalProperties: true
        type: object
    type: object
  swagger.H5AppWorkflowStartRequest:
    properties:
      businessKey:
        type: string
      businessType:
        type: string
      definitionId:
        type: integer
      definitionVersion:
        type: integer
      formData:
        additionalProperties: true
        type: object
      variables:
        additionalProperties: true
        type: object
    type: object
  swagger.H5AppWorkflowWithdrawRequest:
    properties:
      reason:
        type: string
    type: object
  swagger.InAppNotificationSendRequest:
    properties:
      content:
        description: Content 是通知正文。
        example: 系统将于今晚 22:00 进行维护。
        type: string
      departmentIds:
        description: DepartmentIDs 是指定部门范围下的部门 ID，执行时包含下级部门。
        example:
        - 3
        - 5
        items:
          type: integer
        type: array
      requestId:
        description: RequestID 是客户端生成的幂等请求标识；为空时由服务端生成。
        example: 8f9f4f33-f9b8-4f2f-9b26-f83c33d4f17f
        type: string
      scope:
        description: Scope 是收件范围。
        enum:
        - all
        - departments
        - users
        example: departments
        type: string
      title:
        description: Title 是通知标题。
        example: 系统维护通知
        type: string
      userIds:
        description: UserIDs 是指定用户范围下的用户 ID。
        example:
        - 66
        - 67
        items:
          type: integer
        type: array
    type: object
  swagger.PublicExamSubmissionRequest:
    properties:
      answers:
        additionalProperties: true
        description: Answers 是以题目 ID 为键的答案。
        type: object
      autoSubmit:
        description: AutoSubmit 表示是否由超时机制自动提交。
        example: false
        type: boolean
      device:
        description: Device 是设备类型。
        example: h5
        type: string
      deviceId:
        description: DeviceID 是设备唯一标识。
        example: device-001
        type: string
      recordId:
        description: RecordID 是已开始考试的答题记录 ID。
        example: 1
        type: integer
      session:
        description: Session 是匿名考试会话标识。
        example: exam-session
        type: string
    type: object
  swagger.PublicExamValidationRequest:
    properties:
      answers:
        additionalProperties: true
        description: Answers 是待校验的考试答案。
        type: object
      device:
        description: Device 是设备类型。
        example: h5
        type: string
      deviceId:
        description: DeviceID 是设备唯一标识。
        example: device-001
        type: string
    type: object
  swagger.PublicSurveyApplyRequest:
    properties:
      answers:
        additionalProperties: true
        description: Answers 是以字段 ID 为键的当前答案。
        type: object
      schema:
        description: Schema 是表单 Schema JSON。
        example: '{"questions":[]}'
        type: string
    type: object
  swagger.PublicSurveySubmissionRequest:
    properties:
      answers:
        additionalProperties: true
        description: Answers 是以题目 ID 为键的答案。
        type: object
      autoSubmit:
        description: AutoSubmit 表示是否由超时机制自动提交。
        example: false
        type: boolean
      device:
        description: Device 是设备或 User-Agent 信息。
        example: h5
        type: string
      deviceId:
        description: DeviceID 是设备唯一标识。
        example: device-001
        type: string
      nickname:
        description: Nickname 是匿名答题人昵称。
        example: 匿名用户
        type: string
      session:
        description: Session 是匿名答题会话标识。
        example: survey-session
        type: string
      startTime:
        description: StartTime 是开始答题时间的 Unix 毫秒时间戳。
        example: 1788316800000
        type: integer
    type: object
  swagger.PublicSurveyValidateRequest:
    properties:
      answers:
        additionalProperties: true
        description: Answers 是待校验的答案。
        type: object
      device:
        description: Device 是设备类型。
        example: h5
        type: string
      deviceId:
        description: DeviceID 是设备唯一标识。
        example: device-001
        type: string
      schema:
        description: Schema 是未指定问卷 ID 时使用的表单 Schema JSON。
        example: '{"questions":[]}'
        type: string
      surveyId:
        description: SurveyID 是已发布问卷 ID；传入后优先使用问卷保存的 Schema。
        example: 1
        type: integer
    type: object
  swagger.ScheduledTaskCronPreviewRequest:
    properties:
      afterMillis:
        description: AfterMillis 是预览起点的 Unix 毫秒时间戳。
        example: 1788316800000
        type: integer
      count:
        description: Count 是需要返回的未来执行时间数量。
        example: 5
        type: integer
      expression:
        description: Expression 是 Cron 表达式。
        example: 0 */5 * * * *
        type: string
      precision:
        description: Precision 是表达式精度。
        enum:
        - second
        - minute
        example: second
        type: string
      timezone:
        description: Timezone 是 IANA 时区名称。
        example: Asia/Shanghai
        type: string
    type: object
  swagger.ScheduledTaskStatusRequest:
    properties:
      enabled:
        description: Enabled 表示是否启用定时任务。
        example: true
        type: boolean
      version:
        description: Version 是用于乐观锁校验的当前版本号。
        example: 1
        type: integer
    type: object
  swagger.SurveyQuestionBankRequest:
    properties:
      category:
        description: Category 是题目分类。
        example: 通用
        type: string
      schema:
        description: Schema 是题目配置 JSON。
        example: '{}'
        type: string
      tags:
        description: Tags 是逗号分隔的题目标签。
        example: 满意度,通用
        type: string
      title:
        description: Title 是题目标题。
        example: 满意度
        type: string
      type:
        description: Type 是题目组件类型。
        example: radio
        type: string
    type: object
  swagger.SurveyTemplatePresetsRequest:
    properties:
      presets:
        description: Presets 是当前管理员的模板预设列表。
        items:
          additionalProperties:
            type: string
          type: object
        type: array
    type: object
  swagger.WorkflowCompleteTaskRequest:
    properties:
      action:
        description: Action 是任务处理动作；reject 终止整个流程，return 将流程退回至已执行过的上游人工节点并继续运行。
        enum:
        - approve
        - reject
        - return
        - submit
        example: approve
        type: string
      comment:
        description: Comment 是处理意见；reject 和 return 动作必填。
        example: 同意
        type: string
      formData:
        additionalProperties: true
        description: FormData 是本次节点填写或更新的表单数据。
        type: object
      returnTargetNodeId:
        description: ReturnTargetNodeID 是退回目标节点 ID；return 动作省略时默认退回上一人工节点。
        example: manager_review
        type: string
      variables:
        additionalProperties: true
        description: Variables 是本次处理更新的流程变量。
        type: object
    type: object
  swagger.WorkflowDispatchDueRequest:
    properties:
      limit:
        description: Limit 是本次最多投递的通知数量。
        example: 100
        type: integer
    type: object
  swagger.WorkflowReasonRequest:
    properties:
      reason:
        description: Reason 是撤回或取消原因。
        example: 业务申请撤销
        type: string
    type: object
  swagger.WorkflowStartDraftRequest:
    properties:
      definitionVersion:
        description: DefinitionVersion 是草稿对应的流程发布版本。
        example: 1
        type: integer
      formData:
        additionalProperties: true
        description: FormData 是流程发起表单数据。
        type: object
    type: object
  swagger.WorkflowStartInstanceRequest:
    properties:
      businessKey:
        description: BusinessKey 是关联业务唯一键。
        example: review-202609
        type: string
      businessType:
        description: BusinessType 是关联业务类型。
        example: performance_review
        type: string
      definitionId:
        description: DefinitionID 是流程定义 ID。
        example: 1
        type: integer
      definitionVersion:
        description: DefinitionVersion 是发起时使用的流程发布版本。
        example: 1
        type: integer
      formData:
        additionalProperties: true
        description: FormData 是流程发起表单数据。
        type: object
      variables:
        additionalProperties: true
        description: Variables 是流程运行变量。
        type: object
    type: object
  template.GradeLevel:
    properties:
      coefficient:
        type: number
      grade:
        type: string
      label:
        type: string
    type: object
  template.NextObjective:
    properties:
      id:
        type: string
      target:
        type: string
      weight:
        type: number
    type: object
  template.ValueRubric:
    properties:
      description:
        type: string
      label:
        type: string
      score:
        type: number
    type: object
  template.ValueTemplate:
    properties:
      definition:
        type: string
      id:
        type: string
      name:
        type: string
      rubric:
        items:
          $ref: '#/definitions/template.ValueRubric'
        type: array
    type: object
  workflowcore.InitiatorConfig:
    properties:
      departmentIds:
        items:
          type: integer
        type: array
      excludedUserIds:
        items:
          type: integer
        type: array
      scope:
        type: string
      userIds:
        items:
          type: integer
        type: array
    type: object
  workflowservice.PublishRequest:
    properties:
      initiator:
        $ref: '#/definitions/workflowcore.InitiatorConfig'
      note:
        type: string
    type: object
  workflowservice.RollbackRequest:
    properties:
      note:
        type: string
    type: object
  workflowservice.SaveOrgApproverAssignmentsRequest:
    properties:
      departmentId:
        type: integer
      identityCode:
        type: string
      subjectId:
        type: integer
      subjectType:
        type: string
      userIds:
        items:
          type: integer
        type: array
    type: object
host: localhost:8083
info:
  contact: {}
  description: 微信小程序打卡项目后端 API。包含用户认证、打卡管理、问卷系统、考试系统、报表导出等功能。
  title: WeCheckin API
  version: "2.0"
paths:
  /api/v2/admin/admin-sessions:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Resp'
      security:
      - AdminToken: []
      summary: 查询 /api/v2/admin/admin-sessions
      tags:
      - API v2-后台管理-管理员
  /api/v2/admin/admin-sessions/{id}/force-offline:
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: integer
      - description: 会话令牌
        in: formData
        name: token
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Resp'
      security:
      - AdminToken: []
      summary: 提交 /api/v2/admin/admin-sessions/{id}/force-offline
      tags:
      - API v2-后台管理-管理员
  /api/v2/admin/admin-sessions/batch-force-offline:
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: ID 列表，多个值用逗号分隔
        in: formData
        name: ids
        type: string
      - description: 会话令牌列表
        in: formData
        name: tokens
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Resp'
      security:
      - AdminToken: []
      summary: 提交 /api/v2/admin/admin-sessions/batch-force-offline
      tags:
      - API v2-后台管理-管理员
  /api/v2/admin/auth/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: 用户名
        in: formData
        name: name
        required: true
        type: string
      - description: 密码
        in: formData
        name: password
        required: true
        type: string
      - description: 密码（兼容参数）
        in: formData
        name: pwd
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Resp'
      summary: 提交 /api/v2/admin/auth/login
      tags:
      - API v2-后台管理-认证
  /api/v2/admin/auth/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Resp'
      security:
      - AdminToken: []
      summary: 提交 /api/v2/admin/auth/logout
      tags:
      - API v2-后台管理-认证
  /api/v2/admin/departments:
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: 部门名称
        in: formData
        name: name
        required: true
        type: string
      - description: 父部门ID
        in: formData
