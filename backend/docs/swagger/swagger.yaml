      endTime:
        type: integer
      id:
        type: integer
      maxResponse:
        type: integer
      mode:
        type: string
      order:
        type: integer
      qr:
        type: string
      settings:
        type: string
      showResult:
        type: integer
      startTime:
        type: integer
      status:
