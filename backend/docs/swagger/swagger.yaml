      finalGrade:
        type: string
      finalNote:
        type: string
      hrbpComment:
        type: string
      hrbpGrade:
        type: string
      managerComment:
        type: string
      managerGrade:
        type: string
      nextObjectives:
        items:
          $ref: '#/definitions/review.NextObjective'
        type: array
      nextPeriod:
        type: string
      objectives:
