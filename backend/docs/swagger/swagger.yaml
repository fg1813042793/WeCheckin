  performance.UserPayload:
    properties:
      account:
        type: string
      avatar:
        type: string
      department:
        type: string
      departmentLevel1:
        type: string
      departmentLevel2:
        type: string
      departmentLevel3:
        type: string
      departmentLevel4:
        type: string
