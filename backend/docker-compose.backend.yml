# Backend-only Docker Compose configuration.
# Use this when MySQL, Redis and Nginx are deployed outside this Compose stack.
#
# Example:
#   cp .env.backend.example .env
#   docker compose -f docker-compose.backend.yml up -d --build

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: 20m
    max-file: 5

services:
  backend:
    image: wecheckin-backend:latest
    container_name: wecheckin-backend
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 8083:8083
    volumes:
      - ./uploads:/root/uploads
      - ./logs:/root/logs
    networks:
      - wecheckin-backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:-8083/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  wecheckin-backend-network:
    driver: bridge
