# Backend-only Docker Compose configuration.
# Use this when MySQL, Redis and Nginx are deployed outside this Compose stack.
#
# Example:
#   cp .env.backend.example .env
#   docker compose -f docker-compose.backend.yml up -d --build

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: ${WECHECKIN_LOG_MAX_SIZE:-20m}
    max-file: ${WECHECKIN_LOG_MAX_FILE:-5}

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WECHECKIN_BACKEND_IMAGE:-wecheckin-backend:latest}
    container_name: ${WECHECKIN_BACKEND_CONTAINER_NAME:-wecheckin-backend}
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      GIN_MODE: ${GIN_MODE:-release}
      WECHECKIN_SERVER_PORT: ${WECHECKIN_SERVER_PORT:-8083}
      WECHECKIN_SERVER_MODE: ${WECHECKIN_SERVER_MODE:-release}
      WECHECKIN_DATABASE_HOST: ${WECHECKIN_DATABASE_HOST:-host.docker.internal}
      WECHECKIN_DATABASE_PORT: ${WECHECKIN_DATABASE_PORT:-3306}
      WECHECKIN_DATABASE_USER: ${WECHECKIN_DATABASE_USER:-wecheckin}
      WECHECKIN_DATABASE_PASSWORD: ${WECHECKIN_DATABASE_PASSWORD:-change-db-password}
      WECHECKIN_DATABASE_DBNAME: ${WECHECKIN_DATABASE_DBNAME:-wecheckin}
      WECHECKIN_REDIS_HOST: ${WECHECKIN_REDIS_HOST:-host.docker.internal}
      WECHECKIN_REDIS_PORT: ${WECHECKIN_REDIS_PORT:-6379}
      WECHECKIN_REDIS_PASSWORD: ${WECHECKIN_REDIS_PASSWORD:-}
      WECHECKIN_REDIS_DB: ${WECHECKIN_REDIS_DB:-0}
      WECHECKIN_CORS_ALLOW_ORIGINS: ${WECHECKIN_CORS_ALLOW_ORIGINS:-*}
      WECHECKIN_LOG_DIR: ${WECHECKIN_LOG_DIR:-/root/logs}
      WECHECKIN_LOG_LEVEL: ${WECHECKIN_LOG_LEVEL:-info}
      WECHECKIN_LOG_MAX_AGE: ${WECHECKIN_LOG_MAX_AGE:-30}
      WECHECKIN_LOG_COMPRESS: ${WECHECKIN_LOG_COMPRESS:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WECHECKIN_BACKEND_HTTP_PORT:-8083}:${WECHECKIN_SERVER_PORT:-8083}"
    volumes:
      - ${WECHECKIN_UPLOADS_DIR:-./uploads}:/root/uploads
      - ${WECHECKIN_LOGS_DIR:-./logs}:/root/logs
    networks:
      - wecheckin-backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${WECHECKIN_SERVER_PORT:-8083}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  wecheckin-backend-network:
    driver: bridge
