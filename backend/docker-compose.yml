x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: ${WECHECKIN_LOG_MAX_SIZE:-20m}
    max-file: ${WECHECKIN_LOG_MAX_FILE:-5}

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: wecheckin-mysql
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wecheckin-root-password}
      MYSQL_DATABASE: ${WECHECKIN_DATABASE_DBNAME:-wecheckin}
      MYSQL_USER: ${WECHECKIN_DATABASE_USER:-wecheckin}
      MYSQL_PASSWORD: ${WECHECKIN_DATABASE_PASSWORD:-wecheckin-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wecheckin-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 30s
      timeout: 5s
      retries: 10

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: wecheckin-redis
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      - WECHECKIN_REDIS_PASSWORD=${WECHECKIN_REDIS_PASSWORD:-wecheckin-redis-password}
    command: >
      sh -c 'if [ -n "$$WECHECKIN_REDIS_PASSWORD" ]; then
      redis-server --appendonly yes --requirepass "$$WECHECKIN_REDIS_PASSWORD";
      else redis-server --appendonly yes; fi'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wecheckin-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${WECHECKIN_REDIS_PASSWORD}\" ]; then redis-cli -a \"$${WECHECKIN_REDIS_PASSWORD}\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 30s
      timeout: 5s
      retries: 10

  # 后端服务
  backend:
    build: .
    container_name: wecheckin-backend
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    ports:
      - "8083:8083"
    environment:
      - APP_ENV=production
      - GIN_MODE=release
      - WECHECKIN_SERVER_PORT=${WECHECKIN_SERVER_PORT:-8083}
      - WECHECKIN_SERVER_MODE=${WECHECKIN_SERVER_MODE:-release}
      - WECHECKIN_DATABASE_HOST=${WECHECKIN_DATABASE_HOST:-mysql}
      - WECHECKIN_DATABASE_PORT=${WECHECKIN_DATABASE_PORT:-3306}
      - WECHECKIN_DATABASE_USER=${WECHECKIN_DATABASE_USER:-wecheckin}
      - WECHECKIN_DATABASE_PASSWORD=${WECHECKIN_DATABASE_PASSWORD:-wecheckin-password}
      - WECHECKIN_DATABASE_DBNAME=${WECHECKIN_DATABASE_DBNAME:-wecheckin}
      - WECHECKIN_REDIS_HOST=${WECHECKIN_REDIS_HOST:-redis}
      - WECHECKIN_REDIS_PORT=${WECHECKIN_REDIS_PORT:-6379}
      - WECHECKIN_REDIS_PASSWORD=${WECHECKIN_REDIS_PASSWORD:-wecheckin-redis-password}
      - WECHECKIN_REDIS_DB=${WECHECKIN_REDIS_DB:-0}
      - WECHECKIN_CORS_ALLOW_ORIGINS=${WECHECKIN_CORS_ALLOW_ORIGINS:-*}
    volumes:
      - ./uploads:/root/uploads
      - ./logs:/root/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wecheckin-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: wecheckin-nginx
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./uploads:/usr/share/nginx/html/uploads
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wecheckin-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  redis_data:

networks:
  wecheckin-network:
    driver: bridge
