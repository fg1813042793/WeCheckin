# Root nginx-only deployment entry.
# This file only starts nginx. Build and start backend/admin/dingtalk-h5 separately.
#
# Default routes:
#   /api/         -> backend API proxy
#   /uploads/     -> backend/uploads static files
#   /             -> admin/dist SPA
#   /dingtalk-h5/ -> dingtalk-h5/dist/build/h5 SPA
#
# Example:
#   docker compose -f docker-compose.nginx.yml up -d

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ${WECHECKIN_NGINX_CONTAINER_NAME:-wecheckin-nginx}
    restart: unless-stopped
    ports:
      - "${WECHECKIN_NGINX_HTTP_PORT:-80}:80"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-32m}
      NGINX_API_UPSTREAM: ${NGINX_API_UPSTREAM:-http://host.docker.internal:8083}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${WECHECKIN_ADMIN_DIST_DIR:-./admin/dist}:/usr/share/nginx/html/admin:ro
      - ${WECHECKIN_DINGTALK_H5_DIST_DIR:-./dingtalk-h5/dist/build/h5}:/usr/share/nginx/html/dingtalk-h5:ro
      - ${WECHECKIN_UPLOADS_DIR:-./backend/uploads}:/usr/share/nginx/html/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
